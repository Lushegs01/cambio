# Cambio CI. No secrets and no funded keys: nothing here can sign or broadcast a transaction.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily read-only check that the Mezo contracts and the recorded evidence still verify.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build, audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches the Docker runtime; SQLite identity needs Node >= 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fails on critical production advisories. Known high advisories (Zod 3 inside wallet SDKs, no
      # published compatible fix) are documented in docs/SECURITY_REVIEW.md and printed here.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm audit --omit=dev || true
      # Submission materials and claims (no network). FAIL breaks the build; BLOCKED (exit 2: owner actions
      # such as the signed-settlement proof, video or pilot) is reported but cannot be mistaken for ready.
      - run: npm run check:submission -- --offline || [ $? -eq 2 ]

  firestore:
    name: Firestore rules and stores (emulator)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules

  e2e:
    name: Browser tests (production build, live testnet reads, no broadcasts)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  live-chain:
    name: Live Mezo checks (read-only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:chain
      - run: npm run test:live
      # Exit 2 (INCONCLUSIVE) is expected while the signed-settlement proof is pending; only FAIL (1) breaks.
      - run: npm run verify:evidence || [ $? -eq 2 ]
      # Full readiness report incl. deployment, CI and live evidence. Only FAIL breaks; BLOCKED is printed.
      - run: npm run check:submission || [ $? -eq 2 ]
        env:
          GITHUB_TOKEN: ${{ github.token }}
